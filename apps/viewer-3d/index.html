<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signhify · 60 FPS scroll preview</title>
    <meta name="description" content="A 60 FPS scroll-reactive preview built from progressive WebP frames - no WebGL bundle." />
    <style>
      :root { --bg: #05070c; --text: #f9fafb; --muted: #9ca3af; --cyan: #38bdf8; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .scroll { height: 100vh; overflow-y: auto; }
      .track { height: 340vh; }
      .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; display: grid; place-items: center; }
      canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
      .overlay { position: absolute; inset: auto 0 0 0; padding: 30px clamp(18px, 5vw, 56px) 38px; background: linear-gradient(0deg, rgba(5,7,12,.94), rgba(5,7,12,0)); pointer-events: none; }
      h1 { margin: 0; font-size: clamp(22px, 4vw, 42px); letter-spacing: -0.02em; max-width: 22ch; line-height: 1.1; }
      p { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
      .hint { position: absolute; top: 22px; right: 24px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(249,250,251,.6); }
      .rail { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); width: 3px; height: 180px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
      .rail span { display: block; width: 100%; height: 0; background: var(--cyan); }
      .static { position: relative; height: 100vh; }
      .static img { width: 100%; height: 100%; object-fit: cover; }
      .error { display: grid; place-items: center; height: 100vh; padding: 24px; text-align: center; color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="root"><div class="error">Loading preview…</div></div>
    <script src="./config.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
