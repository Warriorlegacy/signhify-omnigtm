name: Daily pipeline

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      useLlm:
        description: 'Re-score the shortlist with the LLM chain'
        type: boolean
        default: true
      llmBudget:
        description: 'Max LLM calls for this run'
        type: string
        default: '6'

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  harvest:
    name: Harvest + eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require a durable database
        # Without this, Repo.open() silently falls back to a SQLite file inside the
        # runner and every harvested row is discarded when the job ends. A green
        # run must mean the data reached Postgres.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set; harvest would write to an ephemeral SQLite file inside the runner."
            exit 1
          fi

      - name: Migrate + seed
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OMNIGTM_ENCRYPTION_KEY: ${{ secrets.OMNIGTM_ENCRYPTION_KEY }}

      - name: Harvest ATS boards
        run: npm run harvest -- --limit 30 --llm-budget ${{ inputs.llmBudget || '6' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OMNIGTM_ENCRYPTION_KEY: ${{ secrets.OMNIGTM_ENCRYPTION_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APINEX_API_KEY: ${{ secrets.APINEX_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OMNIGTM_PUBLIC_BASE_URL: ${{ vars.OMNIGTM_PUBLIC_BASE_URL }}
          OMNIGTM_LLM: ${{ inputs.useLlm == false && '0' || '1' }}

      - name: Retention sweep
        # Expired cache keys and 90-day-old usage rows otherwise accumulate
        # forever; the free Postgres tier is 0.5 GB.
        run: npm run maintain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OMNIGTM_ENCRYPTION_KEY: ${{ secrets.OMNIGTM_ENCRYPTION_KEY }}

      - name: Eval gate
        run: npm run eval | tee eval-output.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-output
          path: eval-output.txt
          retention-days: 14

      - name: Heartbeat
        if: always()
        run: echo "pipeline finished at $(date -u +%FT%TZ)"
