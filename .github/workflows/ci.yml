name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, eval, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure FFmpeg
        # Opportunistic only: the media test skips itself when ffmpeg is absent.
        # Bounded because apt-get update hung for the full 25-minute job timeout
        # on the ubuntu-26.04 image (2026-11-06) and blocked every later step.
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed"
            exit 0
          fi
          sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Eval gate (7 dimensions)
        run: npm run eval

      - name: Build dashboard
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
