services:
  web:
    type: web
    name: signhify-omnigtm
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: OMNIGTM_DB_PATH
        value: /app/.data/omnigtm.db
      - key: OMNIGTM_MEDIA_DIR
        value: /app/.data/previews
      - key: OMNIGTM_ENCRYPTION_KEY
        generateValue: true
      - key: OMNIGTM_DASHBOARD_TOKEN
        generateValue: true
      - key: OMNIGTM_PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FREELMAPI_BASE_URL
        sync: false
      - key: FREELMAPI_API_KEY
        sync: false
